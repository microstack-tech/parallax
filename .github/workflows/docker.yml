name: Docker

# Builds the node image from ./Dockerfile and publishes it to Docker Hub
# on release tags. A tag push (v2.0.0) produces:
#
#   parallaxprotocol/parallax:2.0.0
#   parallaxprotocol/parallax:2.0
#   parallaxprotocol/parallax:latest     (skipped for prereleases like v2.0.0-rc1)
#
# for linux/amd64 and linux/arm64, with BuildKit provenance attestation
# and an SBOM attached. Before anything is pushed, the amd64 image is
# scanned with Trivy; unfixed CVEs are ignored, fixable CRITICAL/HIGH
# findings fail the run. The Docker Hub repository description is synced
# from README.docker.md on every tag publish.
#
# workflow_dispatch runs build + scan only (nothing is pushed), so the
# pipeline can be exercised from main without cutting a release.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account with push access to the repo
#   DOCKERHUB_TOKEN    - access token for that account (not the password)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# GitHub is deprecating Node.js 20 for JS-based actions; the official
# replacements (actions/checkout v5, setup-go v6, etc.) haven't shipped
# yet, so opt into the Node 24 runtime via the documented env var until
# they do. Drop this once every action used here advertises Node 24
# support natively.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE: parallaxprotocol/parallax

jobs:
  publish:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest is only stamped on non-prerelease semver tags
          # (metadata-action's default {{is_default_branch}} latest rule
          # never applies to tag pushes, so manage it explicitly).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

      - name: Resolve build args
        id: args
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            version="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Build the amd64 image alone first and load it into the local
      # daemon so Trivy can scan it before anything reaches the registry.
      # The layer cache is shared with the multi-arch build below, so the
      # amd64 half of that build is a cache hit.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          build-args: |
            COMMIT=${{ steps.args.outputs.commit }}
            VERSION=${{ steps.args.outputs.version }}
            BUILDNUM=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build multi-arch image and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ steps.args.outputs.commit }}
            VERSION=${{ steps.args.outputs.version }}
            BUILDNUM=${{ github.run_number }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub repository description
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: README.docker.md
          short-description: "Parallax full-node client (parallaxd, parallax-cli, parallax-wallet)"
