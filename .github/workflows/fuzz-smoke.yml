name: Fuzz Smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # go test accepts a single -fuzz pattern per invocation, hence the loop.
      # build/fuzz-targets.txt lists one "package-dir fuzz-func" pair per line;
      # update it in the same commit that adds or removes a fuzz target.
      - name: Run native fuzz targets
        run: |
          set -e
          failed=0
          while read -r pkg name; do
            case "$pkg" in ""|\#*) continue ;; esac
            echo "=== $pkg $name"
            if ! go test "./$pkg" -run '^$' -fuzz "^${name}\$" -fuzztime 30s -fuzzminimizetime 5s; then
              failed=1
            fi
          done < build/fuzz-targets.txt
          exit $failed

      - name: Upload new crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
